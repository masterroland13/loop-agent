[project]
name = "hal-agent-backend"
version = "0.1.0"
description = "Backend for Hal Agent: a self-growing agent chat window"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.0",
    "openai>=1.55.0",
    "python-dotenv>=1.0.0",
    "aiofiles>=24.1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
]

[project.scripts]
hal = "agent_window.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_window"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
